spring.application.name=github-repository-searcher

# PostgreSQL Database

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/github_searcher}

spring.datasource.username=${DB_USERNAME:postgres}

spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# GitHub API
# Optional: a personal access token raises GitHub's unauthenticated rate limit
# (60 requests/hour) to 5,000/hour. Leave GITHUB_TOKEN unset to run without one.

github.token=${GITHUB_TOKEN:}